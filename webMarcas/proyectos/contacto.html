<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUSANPAL - Reserva tu Renting</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="shortcut icon" href="../img/logo.png" type="image/x-icon">
</head>
<body>
     <header>
        <a href="../index.html"><img src="../img/logo.png" alt="logo" class="fotologo"></a>
            <ul class="navbar">
                <li><a href="../proyectos/renting.html">Renting</a></li>
                <li><a href="../proyectos/sedes.html">sedes</a></li>
                <li><a href="../proyectos/fundadores.html">Fundadores</a></li>
                <li><a href="../proyectos/contacto.html">Contacto</a></li>
            </ul>
        </header>

    <main class="contacto-container">
        <section class="form-reserva-seccion">
            <div class="form-texto-encabezado">
                <h1 class="form-titulo">Reserva tu Vehículo</h1>
                <p class="form-subtitulo">Completa tus datos y un asesor se pondrá en contacto contigo para finalizar los detalles de tu contrato de renting.</p>
            </div>

            <form action="mailto:husanpal@husanpal.es" method="POST" class="form-reserva">
                <div class="form-grupo-fila">
                    <div class="form-campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-campo">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" placeholder="Tus apellidos" required>
                    </div>
                </div>

                <div class="form-grupo-fila">
                    <div class="form-campo">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="form-campo">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="600 000 000" required>
                    </div>
                </div>

                <div class="form-campo">
                    <label for="coche">Modelo de Interés</label>
                    <select id="coche" name="coche" required>
                        <option value="" disabled selected>Selecciona un coche...</option>
                        <option value="200€">Opel Astra</option>
                        <option value="200€">Citroen C3</option>
                        <option value="200€">Hyundai I20</option>
                        <option value="200€">Renault Clio</option>

                        <option value="400€">Toyota Corolla</option>
                        <option value="400€">Ford Mondeo</option>
                        <option value="400€">Nissan Sentra</option>
                        <option value="400€">Volkswagen Golf GTI Mk8</option>

                        <option value="600€">Audi A5</option>
                        <option value="600€">Mercedes Benz C300</option>
                        <option value="600€">Tesla Model 3</option>
                        <option value="600€">BMW Serie 4</option>
                    </select>
                </div>

                <div class="form-campo">
                    <label for="duracion">Duración del Contrato</label>
                    <select id="duracion" name="duracion" required>
                        <option value="24">24 Meses</option>
                        <option value="36" selected>36 Meses (Recomendado)</option>
                        <option value="48">48 Meses</option>
                        <option value="60">60 Meses</option>
                    </select>
                </div>

                <div class="form-campo">
                    <label for="mensaje">Información Adicional o Consultas</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="¿Tienes alguna duda sobre el kilometraje o equipamiento?"></textarea>
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="privacidad" required>
                    <label for="privacidad">Acepto los términos y condiciones y la política de tratamiento de datos.</label>
                </div>

                <button type="submit" class="form-boton">SOLICITAR RESERVA</button>
            </form>
        </section>
    </main>
</body>
</html>
